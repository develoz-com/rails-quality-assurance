name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run CI checks
        run: bin/ci

      - name: Build gem
        run: gem build rails-quality-assurance.gemspec

      - name: Publish to RubyGems
        run: gem push rails-quality-assurance-*.gem